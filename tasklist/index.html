<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config: extend with brand colors -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue:        "#1D4ED8",
                "blue-lt":   "#EFF6FF",
                "blue-md":   "#3B82F6",
                orange:      "#F97316",
                "orange-lt": "#FFF7ED",
              },
            },
            boxShadow: {
              card: "0 2px 20px rgba(0,0,0,0.08)",
            },
          },
        },
      };
    </script>

    <!-- Custom styles (animations, overrides) -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-orange-50 flex flex-col items-center px-4 py-10">

    <!-- ===== HEADER ===== -->
    <header class="w-full max-w-screen-lg mb-8 text-center">
      <div class="flex items-center justify-center gap-2 mb-1">
        <!-- Checklist icon -->
        <svg class="w-8 h-8 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12l2 2 4-4M7 4h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2z" />
        </svg>
        <h1 class="text-3xl font-bold text-blue-700 tracking-tight">Task List</h1>
      </div>
      <p class="text-sm text-slate-400">Stay organised, stay productive.</p>
    </header>

    <!-- ===== MAIN CARD ===== -->
    <main class="w-full max-w-screen-lg bg-white rounded-2xl shadow-card p-6 flex flex-col gap-6">

      <!-- Add task form -->
      <section aria-label="Add new task">
        <form id="task-form" class="flex gap-2" novalidate>
          <input
            id="task-input"
            type="text"
            placeholder="Add a new task…"
            maxlength="120"
            autocomplete="off"
            class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-700
                   placeholder-slate-400 outline-none transition
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
            aria-label="New task title"
          />
          <button
            type="submit"
            class="flex items-center gap-1.5 rounded-xl bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white
                   transition hover:bg-blue-500 active:scale-95"
          >
            <!-- Plus icon -->
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Add
          </button>
        </form>
        <!-- Validation message -->
        <p id="input-error" class="mt-1.5 hidden text-xs text-red-500" role="alert"></p>
      </section>

      <!-- Filter tabs -->
      <nav aria-label="Task filters" class="flex rounded-xl bg-slate-100 p-1 gap-1">
        <button data-filter="all"       class="filter-btn flex-1 rounded-lg py-1.5 text-xs font-semibold transition"><span id="tab-label-all">All</span></button>
        <button data-filter="active"    class="filter-btn flex-1 rounded-lg py-1.5 text-xs font-semibold transition"><span id="tab-label-active">Active</span></button>
        <button data-filter="completed" class="filter-btn flex-1 rounded-lg py-1.5 text-xs font-semibold transition"><span id="tab-label-completed">Completed</span></button>
      </nav>

      <!-- Task list -->
      <section aria-label="Task list">
        <ul id="task-list" class="flex flex-col gap-2" role="list" aria-live="polite"></ul>

        <!-- Empty state -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-10 text-slate-400 gap-3">
          <svg class="w-12 h-12 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                 M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <p id="empty-message" class="text-sm text-center">No tasks yet. Add one above!</p>
        </div>
      </section>

      <!-- Footer: counter + clear -->
      <footer class="flex items-center justify-between text-xs text-slate-400 border-t border-slate-100 pt-4">
        <span id="task-counter">0 task remaining</span>
        <button id="clear-completed-btn"
          class="text-xs font-medium text-orange-500 transition hover:text-orange-600 disabled:opacity-30 disabled:cursor-not-allowed">
          Clear completed
        </button>
      </footer>

    </main>

    <!-- ===== EDIT MODAL ===== -->
    <div id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"
         class="hidden fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/30 backdrop-blur-sm">
      <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6 flex flex-col gap-4">
        <h2 id="modal-title" class="text-base font-bold text-slate-700">Edit Task</h2>
        <input
          id="edit-input"
          type="text"
          maxlength="120"
          class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-700
                 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          aria-label="Edit task title"
        />
        <p id="edit-error" class="hidden text-xs text-red-500" role="alert"></p>
        <div class="flex gap-2 justify-end">
          <button id="edit-cancel"
            class="rounded-xl border border-slate-200 px-4 py-2 text-sm text-slate-500 transition hover:bg-slate-50 active:scale-95">
            Cancel
          </button>
          <button id="edit-save"
            class="rounded-xl bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-500 active:scale-95">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Main script -->
    <script src="script.js"></script>
  </body>
</html>
